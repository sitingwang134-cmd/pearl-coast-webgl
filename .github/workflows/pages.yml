name: Publish playable WebGL game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified WebGL runtime
        run: |
          curl --fail --location --retry 3 -o game.tar.gz https://github.com/sitingwang134-cmd/pearl-coast-webgl/releases/download/v0.1.0/pearl-coast-webgl-v0.1.0.tar.gz
          echo 'c61fc59bf740425369f68b8d32fd97cae06557e75f9b613e8b05fc12172a4f80  game.tar.gz' | sha256sum --check
          mkdir site
          tar -xzf game.tar.gz -C site
          test -s site/index.html
          test -s site/unity/Build/unity.wasm
          test -s site/unity/Build/unity.data
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
